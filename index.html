<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>霞ヶ浦 GeoJSON + 描画ツール + 範囲内アラート</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
  <script>
    const map = L.map('map');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
      edit: {
        featureGroup: drawnItems
      },
      draw: {
        polygon: true,
        polyline: false,
        rectangle: false,
        circle: false,
        marker: false,
        circlemarker: false
      }
    });
    map.addControl(drawControl);

    let kasumigauraLayer = null;

    // GeoJSON読み込みとEPSG:3857 -> EPSG:4326変換
    fetch('kasumigaura.geojson')
      .then(response => response.json())
      .then(data => {
        const toLatLng = ([x, y]) => L.Projection.SphericalMercator.unproject(L.point(x, y));

        const transformed = {
          type: "FeatureCollection",
          features: data.features.map(f => {
            const coords = f.geometry.coordinates[0].map(toLatLng);
            return {
              type: "Feature",
              properties: f.properties,
              geometry: {
                type: "Polygon",
                coordinates: [coords.map(c => [c.lng, c.lat])]
              }
            };
          })
        };

        kasumigauraLayer = L.geoJSON(transformed, {
          style: {
            color: "blue",
            weight: 2,
            fillColor: "lightblue",
            fillOpacity: 0.4
          }
        }).addTo(map);

        map.fitBounds(kasumigauraLayer.getBounds(), { padding: [20, 20], maxZoom: 14 });
      })
      .catch(err => console.error('GeoJSON読み込みエラー:', err));

    // クリック時にkasumigauraのポリゴン内かどうか判定
    map.on('click', function (e) {
      if (!kasumigauraLayer) return;

      let inside = false;

      kasumigauraLayer.eachLayer(function (layer) {
        if (layer instanceof L.Polygon && leafletPip.pointInLayer(e.latlng, layer).length > 0) {
          inside = true;
        }
      });

      if (inside) {
        alert("クリック地点は霞ヶ浦の範囲内です。");
      }
    });

    // Leaflet.PIP（Point In Polygon）ライブラリを使う
    // 簡易実装（GeoJSONだけに対応）
    const leafletPip = {
      pointInLayer: function (latlng, layer) {
        const x = latlng.lng;
        const y = latlng.lat;
        const poly = layer.getLatLngs()[0];
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const xi = poly[i].lng, yi = poly[i].lat;
          const xj = poly[j].lng, yj = poly[j].lat;

          const intersect = ((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / (yj - yi + 1e-12) + xi);
          if (intersect) inside = !inside;
        }
        return inside ? [layer] : [];
      }
    };
  </script>
</body>
</html>
